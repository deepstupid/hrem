name: hrm.enhanced_hrem@EnhancedHREM
use_memory: true
hidden_size: 256
expansion: 4.0
num_heads: 8
pos_encodings: "rope"
puzzle_emb_ndim: ${.hidden_size}
H_layers: 2
L_layers: 4
H_cycles: 2
L_cycles: 12
halt_max_steps: 16
halt_exploration_prob: 0.1
forward_dtype: "float32"
m_loc: 128
d_mem: 256  # Increased memory dimension
top_k: 6    # Increased top-k for better memory retrieval
sparse_addressing: true
use_location_addressing: true

# Enhanced memory parameters for better performance
memory_read_layers: 2
memory_write_layers: 2

loss:
  name: losses@ACTLossHead
  loss_type: stablemax_cross_entropy