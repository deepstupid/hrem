# Enhanced Demo Configuration
demo_config:
  default_mode: lightning
  default_patience: low
  default_hardware: low
  default_detail: basic
  
  # Available demo modes
  modes:
    - lightning     # Ultra-fast demo
    - adaptive      # Time-adaptive demo
    - comprehensive # Full-featured demo
    
  # Available patience levels
  patience_levels:
    - low    # Quick results (1 min max)
    - medium # Balanced (2 min max)
    - high   # Thorough analysis (3 min max)
    
  # Available hardware capabilities
  hardware_levels:
    - low    # Basic hardware
    - medium # Medium hardware
    - high   # High-end hardware
    
  # Available detail levels
  detail_levels:
    - basic         # Minimal metrics
    - adaptive      # Adaptive metrics
    - comprehensive # Full metrics

ui:
  # UI appearance settings
  theme: "default"
  show_progress_bars: true
  show_detailed_metrics: false
  export_metrics_by_default: false
  
  # Default datasets for quick demos
  quick_demo_datasets:
    - synthetic-reverse
    - synthetic-sort
    - synthetic-parity
    
  # Default models for comparison
  default_models:
    - HRM
    - HREM