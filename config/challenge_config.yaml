# Challenge Configuration for HRM/HREM Demo System

challenges:
  - name: "Quick Comparison"
    id: "quick_comparison"
    description: "A quick comparison between HRM and HREM algorithms."
    difficulty: "BEGINNER"
    hardware: "Low"
    duration: "~30 sec"
    dataset:
      dataset: "synthetic-reverse"
    models: 
      - "HRM"
      - "HREM"
    patience_level: "low"
    optimization: false

  - name: "Basic Optimization"
    id: "basic_optimization"
    description: "Basic hyperparameter optimization demo."
    difficulty: "INTERMEDIATE"
    hardware: "Medium"
    duration: "~1 min"
    dataset:
      dataset: "synthetic-sort"
    models:
      - "HRM"
      - "HREM"
    patience_level: "low"
    optimization: true

  - name: "Advanced Analysis"
    id: "advanced_analysis"
    description: "Comprehensive analysis with full optimization."
    difficulty: "ADVANCED"
    hardware: "High"
    duration: "~3 min"
    dataset:
      dataset: "synthetic-parity"
    models:
      - "HRM"
      - "HREM"
    patience_level: "medium"
    optimization: true