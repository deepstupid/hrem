# Defines the scientific challenges (problems/datasets) available in the system.
# The new design treats these as fundamental problems, not pre-canned experiments.

challenges:
  - name: "Synthetic Sort"
    id: "synthetic_sort"
    description: "A simple task to sort a sequence of numbers. Good for testing basic learning and sequential processing."
    dataset:
      dataset: "synthetic-sort"
    scientific_question: "How well can different architectures learn algorithmic sorting?"

  - name: "Synthetic Reverse"
    id: "synthetic_reverse"
    description: "A task to reverse a given sequence. Tests memory and ordered operations."
    dataset:
      dataset: "synthetic-reverse"
    scientific_question: "Can models learn to reverse a sequence, and how does performance scale with length?"

  - name: "Synthetic Parity"
    id: "synthetic_parity"
    description: "A task to determine if the number of '1's in a binary sequence is even or odd. Requires processing the entire sequence."
    dataset:
      dataset: "synthetic-parity"
    scientific_question: "Which models are capable of solving the long-dependency parity problem?"

  - name: "Synthetic Duplicate"
    id: "synthetic_duplicate"
    description: "A task to duplicate a given sequence. Tests generation and memory capacity."
    dataset:
      dataset: "synthetic-duplicate"
    scientific_question: "How effectively can models learn to replicate sequences from memory?"