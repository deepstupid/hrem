    type: int
    low: 1
    high: 4
    smoke_high: 2
  L_cycles:
    type: int
    low: 1
    high: 4
    smoke_high: 2
  H_layers:
    type: int
    low: 1
    high: 4
    smoke_high: 2
  L_layers:
    type: int
    low: 1
    high: 4
    smoke_high: 2
